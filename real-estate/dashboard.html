<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kohinoor Estates - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <h1>Kohinoor Estates & Developers</h1>
        <p>Real Estate Management System</p>
    </header>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="properties.html">Properties</a>
        <a href="tenants.html">Tenants</a>
        <a href="billing.html">Billing</a>
        <a href="payments.html">Payments</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main class="container">

        <h2>Dashboard</h2>

        <section class="cards">

            <div class="card">
                <h3>Total Properties</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Vacant Properties</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Occupied Properties</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Total Revenue</h3>
                <p>₹0</p>
            </div>

        </section>

        <section class="recent">
            <h2>Recent Activity</h2>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Activity</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>-</td>
                        <td>No activity yet</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>

        </section>

    </main>

</body>
</html>
