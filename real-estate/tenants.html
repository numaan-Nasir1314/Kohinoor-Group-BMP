<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kohinoor Estates - Tenants</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <h1>Kohinoor Estates & Developers</h1>
        <p>Real Estate Management System</p>
    </header>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="properties.html">Properties</a>
        <a href="tenants.html">Tenants</a>
        <a href="billing.html">Billing</a>
        <a href="payments.html">Payments</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main class="container">

        <h2>Tenants</h2>

        <section class="property-section">

            <div class="property-header">
                <h3>Tenant List</h3>
                <button class="add-btn">+ Add Tenant</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Tenant ID</th>
                        <th>Name</th>
                        <th>Property</th>
                        <th>Contact</th>
                        <th>Status</th>
                    </tr>
                </thead>

<tbody>
    <tr>
        <td>
            <input type="text" placeholder="Enter Tenant ID">
        </td>

        <td>
            <input type="text" placeholder="Enter Tenant Name">
        </td>

        <td>
            <input type="text" placeholder="Enter Property">
        </td>

        <td>
            <input type="text" placeholder="Enter Contact">
        </td>

        <td>
            <select>
                <option value="">Select Status</option>
                <option>Active</option>
                <option>Inactive</option>
                <option>Pending</option>
            </select>
        </td>
    </tr>
</tbody>

</table>
        </section>

    </main>

</body>
</html>
