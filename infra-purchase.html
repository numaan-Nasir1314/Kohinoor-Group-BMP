<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase - Kohinoor Infra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="style.css" rel="stylesheet">
</head>
<body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <div class="navbar-logo">
                    <img src="images/logo.jpeg" alt="Kohinoor Group Logo" class="navbar-logo-img">
                </div>
                <span class="navbar-brand-text">Kohinoor Group</span>
            </a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <div class="page-header">
                <button class="btn btn-back" id="backToDashboardBtn">
                    <i class="fas fa-arrow-left me-2"></i>Back
                </button>
                <h2 class="dashboard-title">Purchase</h2>
                <p class="dashboard-subtitle">Add new stock purchase and automatically update inventory and ledger.</p>
            </div>

            <div class="form-card">
                <form id="infraPurchaseForm" class="purchase-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="supplierName" class="form-label">Supplier / Distributor</label>
                            <input type="text" id="supplierName" class="form-control" placeholder="Enter supplier name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="invoiceNumber" class="form-label">Invoice No.</label>
                            <input type="text" id="invoiceNumber" class="form-control" placeholder="Enter invoice number" required>
                        </div>
                        <div class="col-md-6">
                            <label for="inventoryItem" class="form-label">Inventory Item</label>
                            <input type="text" id="inventoryItem" class="form-control" placeholder="Enter item name" required>
                        </div>
                        <div class="col-md-3">
                            <label for="inventoryQty" class="form-label">Quantity</label>
                            <input type="number" id="inventoryQty" class="form-control" min="1" step="1" placeholder="0" required>
                        </div>
                        <div class="col-md-3">
                            <label for="unitRate" class="form-label">Unit Rate</label>
                            <input type="number" id="unitRate" class="form-control" min="0" step="0.01" placeholder="0">
                        </div>
                        <div class="col-md-4">
                            <label for="purchaseDate" class="form-label">Purchase Date (DD/MM/YYYY)</label>
                            <input type="date" id="purchaseDate" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="purchasePaymentMode" class="form-label">Payment Mode</label>
                            <select id="purchasePaymentMode" class="form-select">
                                <option value="Cash">Cash</option>
                                <option value="UPI">UPI</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Cheque">Cheque</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="paidAmount" class="form-label">Paid Amount</label>
                            <input type="number" id="paidAmount" class="form-control" min="0" step="0.01" value="0">
                        </div>
                        <div class="col-md-6">
                            <label for="invoiceAttachment" class="form-label">Invoice Photo</label>
                            <input type="file" id="invoiceAttachment" class="form-control" accept="image/*">
                        </div>
                        <div class="col-md-6">
                            <label for="inventoryPhoto" class="form-label">Inventory Photo</label>
                            <input type="file" id="inventoryPhoto" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-form-submit">
                            <i class="fas fa-save me-2"></i>Save Purchase
                        </button>
                        <button type="reset" class="btn btn-form-clear">
                            <i class="fas fa-eraser me-2"></i>Clear
                        </button>
                    </div>
                </form>
            </div>

            <div class="detail-section mt-4">
                <div class="detail-header">
                    <h3 class="detail-title">Recent Purchases</h3>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped purchase-details-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Supplier</th>
                                <th>Invoice</th>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Rate</th>
                                <th>Total</th>
                                <th>Invoice</th>
                            </tr>
                        </thead>
                        <tbody id="infraPurchaseTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
