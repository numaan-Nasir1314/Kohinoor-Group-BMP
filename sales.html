<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales - Kohinoor Mango Traders</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="style.css" rel="stylesheet">
</head>
<body class="dashboard-body">
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <div class="navbar-logo">
          <img src="images/logo.jpeg" alt="Kohinoor Group Logo" class="navbar-logo-img">
        </div>
        <span class="navbar-brand-text">Kohinoor Group</span>
      </a>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="container">
      <div class="page-header">
        <button class="btn btn-back" id="backToMangoBtn">
          <i class="fas fa-arrow-left me-2"></i>Back
        </button>
        <h2 class="dashboard-title">Sales Entry</h2>
        <p class="dashboard-subtitle">Record new sales for Laser tracking.</p>
      </div>

      <div class="form-card">
        <form id="salesForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Customer Name</label>
              <input type="text" id="customerName" class="form-control" list="ledgerNameSuggestions" required>
              <datalist id="ledgerNameSuggestions"></datalist>
            </div>

            <div class="col-md-6">
              <label class="form-label">Invoice ID</label>
              <input type="text" id="invoiceId" class="form-control" list="ledgerIdSuggestions">
              <datalist id="ledgerIdSuggestions"></datalist>
            </div>

            <div class="col-md-4">
              <label class="form-label">Date</label>
              <input type="date" id="saleDate" class="form-control" value="">
            </div>

            <div class="col-md-4">
              <label class="form-label">Amount</label>
              <input type="number" id="saleAmount" class="form-control" step="0.01" min="0" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Payment Mode</label>
              <select id="paymentMode" class="form-select">
                <option value="Cash">Cash</option>
                <option value="PhonePay">PhonePay</option>
                <option value="UPI">UPI</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Paid Amount</label>
              <input type="number" id="paidAmount" class="form-control" step="0.01" min="0" value="0">
            </div>

            <div class="col-12 d-flex gap-2 mt-3">
              <button type="submit" class="btn btn-form-submit">
                <i class="fas fa-save me-2"></i>Save Sale
              </button>
              <button type="button" class="btn btn-form-submit" id="salesBillingBtn">
                <i class="fas fa-file-invoice-dollar me-2"></i>Billing
              </button>
              <button type="button" class="btn btn-back" id="cancelSaleBtn">Cancel</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
