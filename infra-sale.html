<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - Kohinoor Infra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="style.css" rel="stylesheet">
</head>
<body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <div class="navbar-logo">
                    <img src="images/logo.jpeg" alt="Kohinoor Group Logo" class="navbar-logo-img">
                </div>
                <span class="navbar-brand-text">Kohinoor Group</span>
            </a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <div class="page-header">
                <button class="btn btn-back" id="backToDashboardBtn">
                    <i class="fas fa-arrow-left me-2"></i>Back
                </button>
                <h2 class="dashboard-title">Sales</h2>
                <p class="dashboard-subtitle">Sell inventory and update stock and ledger automatically.</p>
            </div>

            <div class="form-card">
                <form id="infraSaleForm" class="purchase-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="customerName" class="form-label">Customer Name</label>
                            <input type="text" id="customerName" class="form-control" placeholder="Enter customer name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="saleItem" class="form-label">Inventory Item</label>
                            <select id="saleItem" class="form-select" required></select>
                        </div>
                        <div class="col-md-3">
                            <label for="saleQty" class="form-label">Sale Quantity</label>
                            <input type="number" id="saleQty" class="form-control" min="1" step="1" placeholder="0" required>
                        </div>
                        <div class="col-md-3">
                            <label for="saleUnitRate" class="form-label">Unit Rate</label>
                            <input type="number" id="saleUnitRate" class="form-control" min="0" step="0.01" placeholder="0" required>
                        </div>
                        <div class="col-md-3">
                            <label for="saleDate" class="form-label">Sale Date</label>
                            <input type="date" id="saleDate" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="salePaymentMode" class="form-label">Payment Mode</label>
                            <select id="salePaymentMode" class="form-select">
                                <option value="Cash">Cash</option>
                                <option value="UPI">UPI</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Cheque">Cheque</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="receivedAmount" class="form-label">Received Amount</label>
                            <input type="number" id="receivedAmount" class="form-control" min="0" step="0.01" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Available Quantity</label>
                            <div class="form-control bg-light" id="availableQty">0</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Inventory Preview</label>
                            <div id="saleItemPreview" class="form-control bg-light text-muted" style="min-height: 80px; display:flex; align-items:center; justify-content:center;">No image</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-form-submit">
                            <i class="fas fa-save me-2"></i>Save Sale
                        </button>
                        <button type="reset" class="btn btn-form-clear">
                            <i class="fas fa-eraser me-2"></i>Clear
                        </button>
                    </div>
                </form>
            </div>

            <div class="detail-section mt-4">
                <div class="detail-header">
                    <h3 class="detail-title">Recent Sales</h3>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped purchase-details-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Rate</th>
                                <th>Total</th>
                                <th>Photo</th>
                            </tr>
                        </thead>
                        <tbody id="infraSaleTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
