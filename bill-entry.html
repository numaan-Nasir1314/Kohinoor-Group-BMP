<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Entry - Kohinoor Group</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <div class="navbar-logo">
                    <img src="images/logo.jpeg" alt="Kohinoor Group Logo" class="navbar-logo-img">
                </div>
                <span class="navbar-brand-text">Kohinoor Group</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <span class="nav-link welcome-text">
                            <i class="fas fa-user-circle me-2"></i>Welcome Admin
                        </span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-logout" id="logoutBtn">
                            <i class="fas fa-sign-out-alt me-2"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <div class="page-header">
                <button class="btn btn-back" id="backToPurchaseBtn">
                    <i class="fas fa-arrow-left me-2"></i>Back
                </button>
                <h2 class="dashboard-title">Bill Entry</h2>
                <p class="dashboard-subtitle">Create a bill linked to the selected purchase</p>
            </div>

            <div class="form-card">
                <form id="billEntryForm" class="purchase-form">
                    <div class="row g-4 bill-info-grid">
                        <div class="col-md-4">
                            <label class="form-label">Farmer Name</label>
                            <input type="text" class="form-control" id="billFarmerName" placeholder="Enter farmer name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Arrival No.</label>
                            <input type="text" class="form-control" id="billSerialNo" placeholder="Arrival no.">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="billDate">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Station</label>
                            <input type="text" class="form-control" id="billStation" readonly>
                        </div>
                    </div>

                    <div class="row g-4 mt-4 align-items-start">
                        <div class="col-lg-4">
                            <div class="detail-section h-100">
                                <div class="detail-header">
                                    <h4 class="detail-title">Expense</h4>
                                </div>
                                <div id="billingExpenseSummary" class="small text-muted"></div>
                            </div>
                        </div>

                        <div class="col-lg-8">
                            <div class="detail-section">
                                <div class="detail-header">
                                    <h4 class="detail-title">Bill Details</h4>
                                    <button type="button" class="btn btn-form-submit btn-sm" id="addBillRowBtn">
                                        <i class="fas fa-plus me-2"></i>Add Row
                                    </button>
                                </div>

                                <div class="table-responsive">
                                    <table class="table purchase-details-table" id="billDetailsTable">
                                        <thead>
                                            <tr>
                                                <th class="bill-no-column"></th>
                                                <th class="bill-sl-no-column">SL.No.</th>
                                                <th>Variety</th>
                                                <th>Qty</th>
                                                <th>Rate</th>
                                                <th>Amount</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody id="billDetailsBody">
                                            <tr>
                                                <td>
                                                    <div class="input-group input-group-sm">
                                                        <input type="number" class="form-control bill-base-rate" min="0" step="0.01" placeholder="0">
                                                    </div>
                                                </td>
                                                <td class="bill-sl-no-cell">1</td>
                                                <td><input type="text" class="form-control form-control-sm bill-variety" placeholder="Enter variety"></td>
                                                <td><input type="number" class="form-control form-control-sm bill-qty" min="0" step="1" placeholder="0"></td>
                                                <td><input type="number" class="form-control form-control-sm bill-rate" min="0" step="0.01" readonly placeholder="0"></td>
                                                <td><input type="number" class="form-control form-control-sm bill-amount" min="0" step="0.01" readonly placeholder="0"></td>
                                                <td><button type="button" class="btn btn-outline-danger btn-sm delete-bill-row-btn"><i class="fas fa-trash"></i></button></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="grand-total-section">
                                    <h5 class="detail-title">Grand Total: <span id="grandTotalAmount">0.00</span></h5>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-form-submit">
                            <i class="fas fa-save me-2"></i>Save
                        </button>
                        <button type="button" class="btn btn-form-clear" id="clearBillBtn">
                            <i class="fas fa-eraser me-2"></i>Clear
                        </button>
                        <button type="button" class="btn btn-form-submit" id="printBillBtn">
                            <i class="fas fa-print me-2"></i>Print
                        </button>
                        <button type="button" class="btn btn-back" id="backToPurchaseBtnSecondary">
                            <i class="fas fa-arrow-left me-2"></i>Back
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
