<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Ledger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <div class="navbar-logo">
                    <img src="images/logo.jpeg" alt="Kohinoor Group Logo" class="navbar-logo-img">
                </div>
                <span class="navbar-brand-text">Kohinoor Group</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <span class="nav-link welcome-text"><i class="fas fa-user-circle me-2"></i>Welcome Admin</span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container-fluid px-3 px-lg-4">
            <div class="page-header text-center">
                <button class="btn btn-back" id="backToLedgerBtn"><i class="fas fa-arrow-left me-2"></i>Back to Ledger</button>
                <h2 class="dashboard-title">Personal Account Ledger</h2>
                <p class="dashboard-subtitle">Detailed account-wise statement of all vouchers, purchases and sales.</p>
            </div>

            <div class="card p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <h4 class="mb-0" id="accountDetailTitle">Account</h4>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="printAccountLedgerBtn">Print</button>
                </div>
                <p class="mb-3 text-muted" id="accountDetailMeta">Details</p>
                <div class="table-responsive">
                    <table class="table table-bordered table-sm align-middle ledger-table-center mb-0">
                        <thead>
                            <tr>
                                <th style="width: 120px; min-width: 120px;">Date</th>
                                <th>Type</th>
                                <th>Reference</th>
                                <th>Mode</th>
                                <th class="text-end">Debit</th>
                                <th class="text-end">Credit</th>
                            </tr>
                        </thead>
                        <tbody id="accountDetailTableBody"></tbody>
                    </table>
                </div>
                <div id="accountNoDataText" class="mt-3 text-center text-muted"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
